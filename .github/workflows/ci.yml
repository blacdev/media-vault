name: CI

on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [staging, main]

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - name: Lint all PHP files
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

  coding-standards:
    name: WordPress Coding Standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer
      - run: composer install --no-interaction --no-progress
      - run: composer lint

  build:
    name: Build plugin zip
    runs-on: ubuntu-latest
    needs: [php-lint, coding-standards]
    steps:
      - uses: actions/checkout@v4
      - run: bash bin/build-zip.sh
      - uses: actions/upload-artifact@v4
        with:
          name: secure-media-vault
          path: dist/secure-media-vault.zip

  # Pushes to staging publish a pre-release for testing; pushes to main (staging merged) publish the release.
  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: secure-media-vault
          path: dist
      - name: Publish zip to a GitHub release
        run: |
          VERSION="$(grep -m1 'Version:' secure-media-vault.php | awk '{print $NF}')"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            TAG="v${VERSION}"
            TITLE="Secure Media Vault ${VERSION}"
            FLAGS="--latest"
          else
            TAG="v${VERSION}-staging.${GITHUB_RUN_NUMBER}"
            TITLE="Secure Media Vault ${VERSION} (staging build ${GITHUB_RUN_NUMBER})"
            FLAGS="--prerelease"
          fi
          cp dist/secure-media-vault.zip "dist/secure-media-vault-${TAG#v}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/secure-media-vault-${TAG#v}.zip" --clobber
          else
            gh release create "$TAG" "dist/secure-media-vault-${TAG#v}.zip" \
              --target "$GITHUB_SHA" --title "$TITLE" --generate-notes $FLAGS
          fi
